services:
  redis-eitaa:
    image: redis:8.8.0-alpine3.23
    restart: unless-stopped
    container_name: redis-eitaa
    network_mode: "service:nginx-redis"
    volumes:
    - redis-data:/data
    - ./redis/redis-eitaa.conf:/etc/redis/redis.conf:ro
    command: ["redis-server", "/etc/redis/redis.conf"]
    healthcheck:
      test: ["CMD", "redis-cli", "SET", "test:$(date +%s)", "success"]
      interval: 2s
      timeout: 3s
      retries: 5

  nginx-redis:
    image: nginx:1.31.1-trixie
    restart: unless-stopped
    container_name: nginx-redis
    volumes:
    - ./nginx/nginx-redis.conf:/etc/nginx/nginx.conf:ro
    ports:
    - "9000:9000"
    - "9100:9121"   # Required for redis-exporter in problem 3 to work correctly, See: https://stackoverflow.com/q/78051319
    - "9090:9090"   # Required for prometheus in problem 4 to work correctly
    - "3000:3000"   # Required for grafana in problem 4 to work correctly
    healthcheck:
      test: ["CMD", "pidof", "nginx"]
      interval: 2s
      timeout: 3s
      retries: 5

volumes:
  redis-data:
